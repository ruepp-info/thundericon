name: Build and attach XPI

# When a GitHub Release is published, derive the add-on version from its tag,
# build the .xpi, and attach it to that release. The tag (e.g. v1.2.3 or 1.2.3)
# is the single source of truth for the version — no manual version bumping.

on:
  release:
    types: [published]

permissions:
  contents: write          # only to upload the asset to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}   # reliable on release events
        run: |
          VERSION="${TAG#v}"        # strip optional leading "v"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not semver (use 1.2.3 or v1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test
        run: |
          npm ci
          npm test

      - name: Inject version into manifest + package.json
        run: |
          V="${{ steps.ver.outputs.version }}"
          tmp=$(mktemp); jq --arg v "$V" '.version=$v' manifest.json > "$tmp" && mv "$tmp" manifest.json
          tmp=$(mktemp); jq --arg v "$V" '.version=$v' package.json  > "$tmp" && mv "$tmp" package.json

      # strict_max_version is NOT rewritten here. It used to be pinned to the
      # Thunderbird release of the build day, which meant the *next* monthly
      # Thunderbird silently disabled the add-on as "incompatible" — Gecko applies
      # strict compatibility to every WebExtension, so a cap below the running app
      # version disables it outright. The committed cap is deliberately far in the
      # future instead, so a release keeps working across Thunderbird upgrades.
      # This step only reports where the committed cap sits relative to the current
      # Thunderbird, and never fails the build (the feed may be unreachable).
      - name: Check strict_max_version against the current Thunderbird
        run: |
          MAXV=$(jq -r '.browser_specific_settings.gecko.strict_max_version // empty' manifest.json)
          LATEST=$(curl -fsSL --max-time 20 \
            https://product-details.mozilla.org/1.0/thunderbird_versions.json \
            | jq -r '.LATEST_THUNDERBIRD_VERSION // empty') || true
          echo "Committed strict_max_version: ${MAXV:-(unset -> no maximum)}"
          echo "Latest Thunderbird release:   ${LATEST:-(unknown)}"
          CAP="${MAXV%%.*}"; NOW="${LATEST%%.*}"
          if [[ "$CAP" =~ ^[0-9]+$ && "$NOW" =~ ^[0-9]+$ && "$CAP" -lt "$NOW" ]]; then
            echo "::warning::strict_max_version ($MAXV) is below the current Thunderbird ($LATEST); Thunderbird will disable this build as incompatible."
          fi

      - name: Package
        run: python3 tools/package.py

      - name: Attach XPI to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dist/thundericon-${{ steps.ver.outputs.version }}.xpi" --clobber
